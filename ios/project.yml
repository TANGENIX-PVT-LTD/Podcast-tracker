name: PodTrackio

options:
  bundleIdPrefix: com.tangenix
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"

packages:
  YouTubeMetadata:
    url: https://github.com/arraypress/swift-youtube-metadata.git
    revision: ba3ed87b7d8ce99a1b510f12ba453547c4a4d3cc
  YouTubeKit:
    url: https://github.com/b5i/YouTubeKit.git
    revision: 6532af39da4c1612b0a1af603792419d8fb0e67f

targets:
  PodTrackio:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: Sources/PodcastTracker/Models
      - path: Sources/PodcastTracker/ViewModels
      - path: Sources/PodcastTracker/Helpers
      - path: iOS/Sources
      - path: Sources/PodcastTracker/Resources/BrainCanvas
        type: folder
        buildPhase: resources
      - path: iOS/Assets.xcassets
      - path: PodTrackio.icon
        buildPhase: resources
    dependencies:
      - target: PodTrackioWidgets
      - package: YouTubeMetadata
        product: YouTubeTranscript
      - package: YouTubeKit
        product: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangenix.podtrackio
        PRODUCT_NAME: PodTrackio
        PRODUCT_MODULE_NAME: PodcastTracker
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/PodTrackio.entitlements
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: PodTrackio
        SUPPORTS_MACCATALYST: NO

  PodTrackioWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangenix.podtrackio.widgets
        PRODUCT_NAME: PodTrackioWidgets
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PodTrackioWidgets.entitlements
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  PodTrackio:
    build:
      targets:
        PodTrackio: all
        PodTrackioWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
