<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Learning canvas</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--text:#20232b;--muted:#626977;--line:#d8dce5;--panel:rgba(255,255,255,.93);--border:#dfe3ea;--accent:#7364e8;--ease:cubic-bezier(.23,1,.32,1)}
html.dark{--bg:#13141a;--text:#ebedf4;--muted:#989eaf;--line:#343744;--panel:rgba(28,30,39,.94);--border:#353846;--accent:#a797ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text)}
#space{position:absolute;inset:0;touch-action:none;cursor:grab;background-image:radial-gradient(var(--border) .7px,transparent .7px);background-size:24px 24px}#space:active{cursor:grabbing}svg{width:100%;height:100%;display:block}
.node{cursor:grab;outline:none}.node:active{cursor:grabbing}.node text{fill:var(--muted);font-size:11px;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.episode text{font-size:12px;font-weight:560;fill:var(--text)}.node .halo{fill:none;stroke-width:1.5;opacity:0}.node.selected .halo,.node:focus-visible .halo{opacity:1;stroke:var(--accent);stroke-width:2}
.node .dot{stroke:var(--bg);stroke-width:2}.node.selected .dot{stroke:var(--accent);stroke-width:2.5}.edge{fill:none;stroke:var(--line);stroke-width:1;pointer-events:none}.edge.topic{stroke-dasharray:3 5;stroke-opacity:.3}.edge.focused{stroke:var(--accent);stroke-opacity:.8;stroke-width:1.5}
.controls{position:absolute;right:16px;bottom:16px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px;box-shadow:0 4px 24px #0000000a}
button{font:inherit;color:var(--text);background:transparent;border:0;border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background 160ms var(--ease),opacity 160ms var(--ease)}button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}button svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}button[aria-pressed=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.legend{position:absolute;top:14px;left:14px;display:flex;gap:4px;flex-wrap:wrap;padding:4px 7px;border:1px solid var(--border);border-radius:13px;background:var(--panel);max-width:calc(100% - 28px)}.legend button{min-height:36px;min-width:36px;font-size:11px;padding:0 8px}.swatch{width:6px;height:6px;border-radius:50%}
.hint{position:absolute;left:18px;bottom:23px;font-size:11px;color:var(--muted);pointer-events:none}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);line-height:1.6;width:80%;max-width:300px}.empty strong{display:block;color:var(--text);font-size:18px;font-weight:600;margin-bottom:6px}
#announce{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(hover:hover) and (pointer:fine){button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}.node:hover text{fill:var(--text)}}
@media(max-width:500px){.hint{bottom:80px;left:16px}.controls{right:12px;bottom:12px}.legend{top:10px;left:10px}.legend button{font-size:10px;padding:0 6px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:0ms!important}}
</style></head><body>
<div id="space"><svg aria-label="Interactive learning graph. Drag nodes to arrange them. Drag the background to pan; pinch or scroll to zoom." role="group"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg></div>
<div class="legend" aria-label="Document filters"></div>
<div class="hint" id="hint">Drag to explore · scroll to zoom</div>
<div class="controls" aria-label="Canvas controls">
<button id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
<button id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
<button id="fit" aria-label="Fit graph" title="Fit graph"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
<button id="relayout" aria-label="Rearrange graph" title="Rearrange graph"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
<button id="labels" aria-label="Toggle labels" title="Labels" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 5h16M12 5v14m-4 0h8"/></svg></button>
<button id="connections" aria-label="Show topic connections" title="Topic connections" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="m7 11 9-5m-9 7 9 5"/></svg></button>
</div><div class="empty" id="empty"><strong>Your learning has a home.</strong>Generate a transcript or summary to start connecting ideas.</div><div id="announce" aria-live="polite"></div>
<script src="d3.min.js"></script><script src="canvas.js"></script></body></html>
